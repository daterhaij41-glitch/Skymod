name: Build and deploy Skymod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project source
        run: |
          cat bootstrap/archive.part.* > /tmp/skymod-source.tar.xz.b64
          base64 --decode /tmp/skymod-source.tar.xz.b64 > /tmp/skymod-source.tar.xz
          mkdir -p /tmp/skymod-source
          tar -xJf /tmp/skymod-source.tar.xz -C /tmp/skymod-source --strip-components=1
          rm -rf /tmp/skymod-source/.github
          cp -a /tmp/skymod-source/. .

      - name: Apply TypeScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/App.tsx")
          s = p.read_text()
          replacements = {
              "onRemove={async track =>": "onRemove={async (track: Track) =>",
              "onTheme={id =>": "onTheme={(id: SkyTheme) =>",
              "seek(e.target.value)": "seek(Number(e.target.value))",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected source snippet missing: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
